<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل الجيم</title>
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot">جارٍ التحميل…</div>
<section id="login" hidden>
  <form id="loginForm">
    <h1>سجل الجيم</h1>
    <p>سجّل دخولك لعرض تمارينك وتمارين شريكك.</p>
    <input id="email" type="email" placeholder="البريد الإلكتروني" required autocomplete="username">
    <input id="pass" type="password" placeholder="كلمة المرور" required autocomplete="current-password">
    <button class="btn main">دخول</button>
    <div id="loginErr" class="err"></div>
  </form>
</section>

<div id="app" hidden>
  <header>
    <h1>سجل الجيم</h1>
    <div class="bar">
      <span id="net" class="pill"></span>
      <span id="sync" class="pill"></span>
      <button id="menu" class="btn" aria-label="القائمة">☰</button><button id="nm" class="btn">اسمي</button><button id="theme" class="btn" aria-label="الوضع الليلي">◐</button><button id="exp" class="btn">نسخة</button><button id="logout" class="btn">خروج</button>
    </div>
  </header>
  <nav id="tabs"><button data-v="day" class="on"><i>📅</i>اليوم</button><button data-v="log"><i>📋</i>السجل</button><button data-v="ex"><i>📈</i>التمارين</button></nav>
  <main>
    <section id="hero" class="vd"></section>
    <section id="stats" class="vd"></section>
    <section class="cal vd">
      <div class="calhead">
        <button class="btn" id="next" aria-label="الشهر التالي">‹</button>
        <h2 id="monthTitle"></h2>
        <button class="btn" id="prev" aria-label="الشهر السابق">›</button>
        <button class="btn" id="today">اليوم</button>
      </div>
      <div id="grid"></div>
      <div id="legend"></div>
    </section>
    <section id="panel" class="vd"></section>
    <section id="vLog" hidden></section>
    <section id="vEx" hidden></section>
  </main>
</div>
<button id="fab" aria-label="إضافة تمرين" title="إضافة تمرين">+</button>
<div id="timer" hidden><button data-s="60">60</button><button data-s="90">90</button><button data-s="120">120</button><b id="tv">راحة</b></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
